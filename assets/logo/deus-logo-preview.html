<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DEUS logo preview</title>
  <style>
    :root{color-scheme:dark;--surface:#050818;--ink:#edf7ff}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#101b48 0,var(--surface) 55%);color:var(--ink);font:15px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
    main{width:min(1120px,92vw);padding:48px 0} h1{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#72eee9} p{max-width:68ch;color:#a9b6d2}.stage{margin-top:24px;padding:clamp(24px,6vw,76px);border:1px solid #24346a;border-radius:24px;background:#080d24;box-shadow:0 30px 90px #0008}.stage img{display:block;width:100%;height:auto}.sizes{display:flex;align-items:center;gap:28px;margin-top:28px}.sizes img{width:240px}.sizes img:last-child{width:120px}@media(prefers-reduced-motion:reduce){.motion-note::after{content:" Reduced motion is active."}}
  </style>
</head>
<body>
  <main>
    <h1>Decoupled Extended Unitary Script</h1>
    <p class="motion-note">Animated production asset. The motion runs inside the SVG and automatically respects your operating-system preference.</p>
    <section class="stage" aria-label="Animated DEUS logo preview">
      <img src="deus-logo-animated.svg" alt="DEUS — eye and interlocking ribbon logo">
    </section>
    <div class="sizes" aria-label="Small-size checks">
      <img src="deus-logo.svg" alt="DEUS logo at medium size">
      <img src="deus-logo.svg" alt="DEUS logo at small size">
    </div>
  </main>
</body>
</html>
