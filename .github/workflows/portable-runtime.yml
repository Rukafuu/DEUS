name: Portable runtime

on:
  push:
  pull_request:

jobs:
  portable-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test portable VM
        run: ctest --test-dir build -C Release -R "^(deus_portable_vm|deus_semantic_bytecode)$" --output-on-failure
      - name: Smoke pure program
        run: ./build/deus run examples/structured_result.deus
