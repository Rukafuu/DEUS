name: Bug report
description: Report a reproducible problem in DEUS.
title: "[Bug]: "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: DEUS version
      placeholder: "0.x or commit"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Windows version and architecture"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Include the exact command used.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal source
      description: Include the smallest `.deus` input that reproduces the issue.
      render: deus
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      render: text
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
